[project]
name = "supplychain-copilot"
version = "0.1.0"
description = "SupplyChain Copilot - AI assistant for supplier policy, KPI & risk analysis"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langchain>=1.0.5",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.0.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.2",
    "pinecone==6.0.2",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "streamlit>=1.51.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.8.0",
    "sqlglot>=26.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=5.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

