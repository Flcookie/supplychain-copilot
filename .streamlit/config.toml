# Avoid scanning transformers/sentence-transformers (optional deps) in site-packages,
# which triggers torchvision import errors and can cause a blank UI reload loop.
[server]
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
